			shellScript = "# MPVKit's libraries are linked statically into the app, but each of its\n# xcframeworks also carries an empty stub dylib that Xcode embeds and signs:\n# 27 frameworks, 1.6 MB, exporting nothing and loaded by nothing. Drop any\n# embedded framework whose binary exports no symbols and that the app does\n# not load. (This also ends the App Store Connect warnings about those stubs\n# having no dSYM, which an earlier script here papered over with dsymutil.)\nframeworks=\"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH\"\n[ -d \"$frameworks\" ] || exit 0\napp=\"$TARGET_BUILD_DIR/$EXECUTABLE_PATH\"\nfor framework in \"$frameworks\"/*.framework; do\n  [ -d \"$framework\" ] || continue\n  name=$(basename \"$framework\" .framework)\n  binary=\"$framework/$name\"\n  [ -f \"$binary\" ] || continue\n  if nm -gU \"$binary\" 2>/dev/null | grep -qv ' __mh_'; then continue; fi\n  if otool -L \"$app\" 2>/dev/null | grep -q \"/$name.framework/\"; then continue; fi\n  rm -rf \"$framework\"\n  echo \"note: removed empty framework stub $name.framework\"\ndone\nrmdir \"$frameworks\" 2>/dev/null || true\n";
