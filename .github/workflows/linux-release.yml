name: Release Linux deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Nothing gets write access unless a job below asks for it. Actions are pinned
# to commits because a tag can be moved, and a moved tag would run in this
# pipeline; the comment beside each hash is what it was when pinned.
permissions:
  contents: read

jobs:
  # Compiling runs third-party code: npm install scripts, crates' build.rs. So
  # this job holds no token that can write to the repository or its releases.
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The .deb is stamped with tauri.conf.json's version, not the tag's, so a
      # tag pushed without running bump-version.sh would publish a package apt
      # treats as the one already installed. Fail before building instead.
      - name: Check tag matches version
        run: |
          conf="$(jq -r .version src-tauri/tauri.conf.json)"
          pkg="$(jq -r .version package.json)"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::Version files disagree; run ./bump-version.sh"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$conf" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $conf; bump the version (./bump-version.sh) and re-tag"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev libmpv-dev

      # Exactly what the lockfiles say, or the build fails.
      - name: npm ci
        run: npm ci

      - name: Build deb
        run: ./build-deb.sh -- --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aquarium-deb
          path: Linux/aquarium.deb
          if-no-files-found: error
          retention-days: 1

  # The only job that can write. It never checks out or runs the project's code.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aquarium-deb

      - name: Checksum
        run: sha256sum aquarium.deb > SHA256SUMS

      # Check a download with: gh attestation verify aquarium.deb --repo eggprez/Aquarium
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: aquarium.deb

      - name: Publish to Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            aquarium.deb
            SHA256SUMS
          fail_on_unmatched_files: true
