name: Release Linux deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Linux
    steps:
      - uses: actions/checkout@v4

      # The .deb is stamped with tauri.conf.json's version, not the tag's, so a
      # tag pushed without running bump-version.sh would publish a package apt
      # treats as the one already installed. Fail before building instead.
      - name: Check tag matches version
        run: |
          conf="$(jq -r .version src-tauri/tauri.conf.json)"
          pkg="$(jq -r .version package.json)"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::Version files disagree; run ./bump-version.sh"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$conf" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $conf; bump the version (./bump-version.sh) and re-tag"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev libmpv-dev

      - name: npm install
        run: npm install

      - name: Build deb
        run: ./build-deb.sh

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: Linux/aquarium.deb
          fail_on_unmatched_files: true
