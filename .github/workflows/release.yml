name: Release AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev mpv zsync

      - name: npm install
        run: npm install

      - name: Build AppImage (with embedded update info)
        env:
          # Lets the bundled AppImage self-update via AppImageUpdate,
          # pointed at this repo's GitHub Releases.
          UPDATE_INFORMATION: gh-releases-zsync|eggprez|FellyJin|latest|FellyJin-x86_64.AppImage.zsync
        run: ./build-appimage.sh

      - name: Locate artifacts
        id: artifacts
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          echo "appimage=$BUNDLE_DIR/FellyJin-x86_64.AppImage" >> "$GITHUB_OUTPUT"
          echo "zsync=$BUNDLE_DIR/FellyJin-x86_64.AppImage.zsync" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.zsync }}
