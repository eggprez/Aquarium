# Aquarium bundled mpv key/mouse bindings.
#
# Mouse events go to the embedded mpv surface, not the webview, so mpv's
# default double-click binding (cycle fullscreen) triggered a WM-level
# fullscreen the app knows nothing about: the uosc controls stay disabled
# (they're only enabled by the app's own fullscreen toggle) and the user is
# left staring at what looks like a bare/default mpv. Route every fullscreen
# gesture through the app instead.
MBTN_LEFT_DBL script-message aquarium-fullscreen
f script-message aquarium-fullscreen
# ESC must only ever exit fullscreen, never enter it.
ESC script-message aquarium-fullscreen-exit

# The bundled mpv build ships a built-in right-click context menu that is not
# part of Aquarium's UI. Right-click opens Aquarium's own player menu instead
# (drawn in the picture by uosc: nothing in the page can draw over the video).
MBTN_RIGHT script-message aquarium-context

# The wheel over the picture: up and down change the volume, sideways (a
# tilting wheel, or two fingers on a touchpad) scrubs. mpv's defaults seek on
# the vertical wheel.
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
WHEEL_LEFT seek -5
WHEEL_RIGHT seek 5

# Keys pressed while the picture has keyboard focus (after a click on it) go
# to mpv rather than the page. These are the page's own shortcuts, handed back
# to it so both places behave the same: the arrows follow the skip interval
# in Settings, and c / s / i are Aquarium's (mpv has screenshot on s and its
# stats page on i, neither of which this player offers).
LEFT script-message aquarium-key back
RIGHT script-message aquarium-key forward
UP add volume 5
DOWN add volume -5
c script-message aquarium-key subtitles
C script-message aquarium-key subtitles
s script-message aquarium-key skip
S script-message aquarium-key skip
i script-message aquarium-key info
Ctrl+i script-message aquarium-key info
? script-message aquarium-key shortcuts
# Audio delay, on mpv's own Ctrl++ / Ctrl+- (and Ctrl+= for the unshifted +).
Ctrl+= script-message aquarium-key audio-later
Ctrl++ script-message aquarium-key audio-later
Ctrl+- script-message aquarium-key audio-earlier
Ctrl+0 script-message aquarium-key audio-reset
