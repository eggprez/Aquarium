# Aquarium bundled mpv configuration (used via --config-dir).
osd-bar=no
# uosc autohide=yes follows the cursor: hide the fullscreen controls after 1s
# of mouse inactivity over the video.
cursor-autohide=1000

# The "battery saver rendering" chain, as a profile the app can put on and take
# off mid-film: Settings' Automatic mode applies it while the machine is on
# battery or in the power-saver profile (see src-tauri/src/power.rs) and
# `profile-restore=copy` puts every option back as it was when it comes off.
# Every pass of mpv's default scaler chain runs at the panel's full size —
# 2880×1920 on a HiDPI laptop — through 16-bit float intermediates; from the
# couch, bilinear and lanczos are the same picture. Keep this list in step
# with `Prefs::args` in src-tauri/src/prefs.rs (a unit test checks).
[aquarium-battery]
profile-restore=copy
scale=bilinear
cscale=bilinear
dscale=bilinear
dither=no
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no
fbo-format=rgba8
