<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Aquarium app icon, simplified for 32 px and below: Aquarium.svg's
       small bubbles turn into noise at that size. Used by ./make-icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d4fba"/>
      <stop offset="0.5" stop-color="#7064c6"/>
      <stop offset="1" stop-color="#0f9bd3"/>
    </linearGradient>
    <linearGradient id="well" x1="304" y1="304" x2="720" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d4fba"/>
      <stop offset="0.5" stop-color="#7064c6"/>
      <stop offset="1" stop-color="#1296d0"/>
    </linearGradient>
    <!-- soft top sheen over the whole tile -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a1560" flood-opacity="0.35"/>
    </filter>
    <filter id="wellShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dy="10"/>
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feFlood flood-color="#1c0f45" flood-opacity="0.35"/>
      <feComposite in2="inner" operator="in"/>
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="205"/>
    </clipPath>
    <!-- one bubble, unit radius 100, centred on the origin -->
    <g id="b">
      <circle r="100" fill="#3d4fb8" fill-opacity="0.12"/>
      <circle r="100" fill="url(#bubble)"/>
      <circle r="101" fill="none" stroke="#2a2470" stroke-opacity="0.22" stroke-width="4"/>
      <circle r="96" fill="none" stroke="#fff" stroke-opacity="0.95" stroke-width="12"/>
      <path d="M -62 -24 A 66 66 0 0 1 -26 -62" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
      <circle cx="-8" cy="-68" r="7" fill="#fff"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- the frame: a white rounded ring around a gradient well -->
    <path filter="url(#ringShadow)" fill="#fff" fill-rule="evenodd"
          d="M 362 192 H 662 A 170 170 0 0 1 832 362 V 662 A 170 170 0 0 1 662 832 H 362 A 170 170 0 0 1 192 662 V 362 A 170 170 0 0 1 362 192 Z
             M 396 304 A 92 92 0 0 0 304 396 V 628 A 92 92 0 0 0 396 720 H 628 A 92 92 0 0 0 720 628 V 396 A 92 92 0 0 0 628 304 Z"/>
    <rect x="304" y="304" width="416" height="416" rx="92" fill="url(#well)"/>
    <rect x="304" y="304" width="416" height="416" rx="92" fill="#000" filter="url(#wellShadow)"/>

    <!-- small-size variant: three bold bubbles, no speckles -->
    <use href="#b" transform="translate(800 800) scale(1.3)"/>
    <use href="#b" transform="translate(905 470) scale(0.72)"/>
    <use href="#b" transform="translate(150 850) scale(0.72)"/>
  </g>
</svg>
