<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquarium</title>
    <!-- Applies the last resolved theme before first paint. A separate file
         rather than an inline script so the CSP can refuse inline scripts. -->
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <div id="app">
      <div id="login-root" class="hidden"></div>
      <div id="shell" class="hidden">
        <aside id="sidebar">
          <div class="brand">
            <img class="brand-mark" src="/aquarium-logo.svg" alt="" width="30" height="30" />
            <span class="wordmark">Aqua<b>rium</b></span>
          </div>
          <nav id="nav" aria-label="Primary"></nav>
          <div class="sidebar-footer" id="sidebar-footer"></div>
        </aside>
        <main id="main">
          <header id="topbar">
            <button id="back-btn" class="nav-btn" title="Back" aria-label="Go back" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="search-wrap">
              <input id="search-input" type="search" placeholder="Search movies, shows, episodes…" autocomplete="off" aria-label="Search movies, shows and episodes" />
              <div id="search-recent" class="search-recent" hidden></div>
            </div>
          </header>
          <!-- Under the top bar on every page while the server can't be
               reached. A still icon, no pulse: it is up for as long as the
               machine is offline. -->
          <div id="offline-strip" role="status" hidden>
            <svg class="offline-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 4.2-2.7M10.7 5.1A15 15 0 0 1 22 8.8M5 12.9a10 10 0 0 1 5.2-2.7M16.9 11.1a10 10 0 0 1 2.1 1.8M8.5 16.4a5 5 0 0 1 7 0"/><path d="M12 20h.01M3 3l18 18"/></svg>
            <div class="offline-text">
              <strong>Offline — showing downloads</strong>
              <span id="offline-status">Your server can't be reached</span>
            </div>
            <button id="offline-retry" class="btn small" type="button">Retry</button>
          </div>
          <div id="content"></div>
        </main>
      </div>
      <div id="player-bar" class="hidden"></div>
      <div id="toasts"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
