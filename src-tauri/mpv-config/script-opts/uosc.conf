# FellyJin uses uosc only for its in-video menus (subtitles, audio, episode
# queue) and the pause indicator. Its controls/timeline stay permanently
# disabled: the app's own player bar is the one UI everywhere — in fullscreen
# the app reveals it by shrinking the video surface on mouse motion (mpv
# reports mouse-pos over IPC), so uosc no longer provides fullscreen controls.
# The `controls=` layout below is therefore inert but kept for reference.
controls=command:subtitles:script-binding uosc/subtitles?Subtitles,command:graphic_eq:script-binding uosc/audio?Audio,gap,space,play-pause,space,gap,command:high_quality:script-message fellyjin-menu quality?Quality,command:list_alt:script-message fellyjin-menu episodes?Episodes,command:fullscreen_exit:script-message fellyjin-fullscreen?Exit fullscreen
timeline_size=40
progress=never
volume=none
top_bar=never
autohide=yes
disable_elements=controls,timeline
# Match the client's theme (styles.css) so the fullscreen controls read as
# FellyJin, not stock mpv: violet accent on the app's dark raised background.
color=foreground=8b5cf6,foreground_text=ffffff,background=16161f,background_text=ececf4,curtain=0e0e14,success=34d399,error=ef4444
