[package]
name = "aquarium"
version = "0.1.30"
description = "Lightweight Jellyfin client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-window-state = "2"
# Access tokens live in the desktop keyring (Secret Service) rather than in
# config.json. `crypto-rust` keeps the D-Bus session encryption in pure Rust so
# the build needs no extra system libraries.
#
# This talks to the Secret Service directly rather than through the `keyring`
# crate, which opened and tore down a D-Bus connection per operation and
# crash-looped gnome-keyring as a result — see the header of `secret.rs`.
dbus-secret-service = { version = "4", features = ["crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
# XMLTV guides are usually published gzipped, so a custom Live TV source has to
# be able to unwrap one before it can be parsed.
flate2 = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Video is rendered in-process through libmpv's render API into a GtkGLArea we
# own, rather than by handing mpv an X11 child window id. `libmpv2-sys` is the
# same crate `libmpv2` builds on; the render context is hand-rolled over it
# because the safe `RenderContext<'a>` borrows the `Mpv`, which makes "one
# struct owning both" self-referential (see WAYLAND-MIGRATION.md, Phase 0).
libmpv2 = "6"
libmpv2-sys = "4"
# GL entry points, loaded out of libepoxy by hand. The `epoxy` crate does not
# build: it pins a yanked xml-rs through gl_generator 0.9.
libloading = "0.8"
# The widget tree the video surface lives in. Already in the tree via tauri,
# declared here because we reach into it directly.
gtk = "0.18"
# statvfs, for the free-space check before a download is queued. std has no
# equivalent, and libc is already in the tree via tokio.
libc = "0.2"
dbus = "0.9"
# Serves the MPRIS interface (media keys, the GNOME lock screen and shell
# controls). The low-level `dbus` API can do it, but every property and method
# would be hand-dispatched from a match on the message name.
dbus-crossroads = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[lib]
name = "aquarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
