[package]
name = "fellyjin"
version = "0.1.0"
description = "Lightweight Jellyfin client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
x11rb = "0.13"
raw-window-handle = "0.6"
dbus = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[lib]
name = "fellyjin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
